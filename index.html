<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIXIR - Catálogo Exclusivo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            letter-spacing: 4px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
        }
        #admin-panel {
            display: none;
            background: #111;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }
        #admin-panel input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            box-sizing: border-box;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        #admin-panel button {
            flex: 1;
            padding: 10px;
            background: #fff;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        #cancel-btn {
            background: #444 !important;
            color: #fff !important;
            display: none;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }
        .product-card {
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            cursor: pointer;
        }
        .product-info {
            padding: 10px;
            flex-grow: 1;
        }
        .product-name {
            font-size: 14px;
            margin-bottom: 5px;
            display: block;
        }
        .product-price {
            font-size: 16px;
            font-weight: bold;
            color: #4CAF50;
        }
        .whatsapp-btn {
            background: #25D366;
            color: #fff;
            text-align: center;
            padding: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: block;
        }
        .admin-controls {
            display: flex;
            background: #222;
            border-top: 1px solid #333;
        }
        .admin-controls button {
            flex: 1;
            padding: 6px;
            font-size: 11px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit { background: #ff9800; color: #fff; }
        .btn-delete { background: #f44336; color: #fff; }

        .message {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            padding: 20px;
        }
        /* Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>ELIXIR</h1>
    <div class="subtitle">CATÁLOGO EXCLUSIVO<br>Contamos con más variedad de mercancía, consultar al WhatsApp</div>

    <!-- Panel de Administración Oculto -->
    <div id="admin-panel">
        <h3 id="panel-title">Agregar Producto</h3>
        <input type="hidden" id="edit-prod-id">
        <input type="hidden" id="edit-prod-image-url">
        
        <input type="text" id="prod-name" placeholder="Nombre del producto">
        <input type="number" id="prod-price" placeholder="Precio ($)">
        <input type="file" id="prod-file" accept="image/*">
        
        <div class="btn-group">
            <button id="save-btn" onclick="saveProduct()">Subir Producto</button>
            <button id="cancel-btn" onclick="resetForm()">Cancelar</button>
        </div>
    </div>

    <!-- Contenedor de Productos -->
    <div id="products-container" class="products-grid">
        <div class="message">Cargando tienda...</div>
    </div>

    <!-- Modal para ver imagen grande -->
    <div id="modal" onclick="closeModal()">
        <img id="modal-img" src="">
    </div>

    <script>
        const SUPABASE_URL = 'https://ojrxjgfjnsbnjplqnall.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_432fYrFKU4G3HMa6Y9XKtg_1YjuMXWL';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const WHATSAPP_LINK = 'https://wa.link/50jjzl';
        let isAdmin = false;

        // Verificar Modo Admin por Ruta (#admin)
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#admin') {
                const pass = prompt('Ingresa la contraseña de administrador:');
                if (pass === '33345891') {
                    isAdmin = true;
                    document.getElementById('admin-panel').style.display = 'block';
                } else {
                    alert('Contraseña incorrecta');
                    window.location.hash = '';
                }
            }
            loadProducts();
        });

        // Cargar Productos desde Supabase
        async function loadProducts() {
            const container = document.getElementById('products-container');
            
            const { data, error } = await _supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error(error);
                container.innerHTML = '<div class="message">Error al cargar la tienda.</div>';
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="message">No hay productos aún. Entra como admin para agregar.</div>';
                return;
            }

            container.innerHTML = '';
            data.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let adminButtons = '';
                if (isAdmin) {
                    adminButtons = `
                        <div class="admin-controls">
                            <button class="btn-edit" onclick="startEdit(${product.id}, '${escapeHtml(product.name)}', ${product.price}, '${product.image_url}')">Editar</button>
                            <button class="btn-delete" onclick="deleteProduct(${product.id})">Eliminar</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <img src="${product.image_url}" class="product-img" onclick="openModal('${product.image_url}')" alt="${product.name}">
                    <div class="product-info">
                        <span class="product-name">${product.name}</span>
                        <span class="product-price">$${product.price}</span>
                    </div>
                    <a href="${WHATSAPP_LINK}" target="_blank" class="whatsapp-btn">Consultar al WhatsApp</a>
                    ${adminButtons}
                `;
                container.appendChild(card);
            });
        }

        // Crear o Editar Producto
        async function saveProduct() {
            const editId = document.getElementById('edit-prod-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const fileInput = document.getElementById('prod-file');
            let imageUrl = document.getElementById('edit-prod-image-url').value;

            if (!name || !price) {
                alert('Por favor completa el nombre y el precio.');
                return;
            }

            // Si se está creando uno nuevo y no hay imagen, exigirla
            if (!editId && fileInput.files.length === 0) {
                alert('Por favor selecciona una imagen para el producto.');
                return;
            }

            alert('Procesando, por favor espera...');

            // Si seleccionó una nueva imagen, subirla a Storage
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;

                const { error: uploadError } = await _supabase.storage
                    .from('product-images')
                    .upload(fileName, file);

                if (uploadError) {
                    alert('Error al subir la imagen: ' + uploadError.message);
                    return;
                }

                const { data: publicURLData } = _supabase.storage
                    .from('product-images')
                    .getPublicUrl(fileName);

                imageUrl = publicURLData.publicUrl;
            }

            if (editId) {
                // Actualizar registro existente
                const { error: updateError } = await _supabase
                    .from('products')
                    .update({ name, price: parseFloat(price), image_url: imageUrl })
                    .eq('id', editId);

                if (updateError) {
                    alert('Error al actualizar: ' + updateError.message);
                    return;
                }
                alert('¡Producto actualizado con éxito!');
            } else {
                // Insertar nuevo registro
                const { error: insertError } = await _supabase
                    .from('products')
                    .insert([{ name, price: parseFloat(price), image_url: imageUrl }]);

                if (insertError) {
                    alert('Error al guardar: ' + insertError.message);
                    return;
                }
                alert('¡Producto publicado con éxito!');
            }

            resetForm();
            loadProducts();
        }

        // Iniciar modo edición
        function startEdit(id, name, price, imageUrl) {
            document.getElementById('panel-title').innerText = 'Editar Producto';
            document.getElementById('edit-prod-id').value = id;
            document.getElementById('prod-name').value = name;
            document.getElementById('prod-price').value = price;
            document.getElementById('edit-prod-image-url').value = imageUrl;
            
            document.getElementById('save-btn').innerText = 'Guardar Cambios';
            document.getElementById('cancel-btn').style.display = 'block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Eliminar producto
        async function deleteProduct(id) {
            if (!confirm('¿Estás seguro de que deseas eliminar este producto?')) return;

            const { error } = await _supabase
                .from('products')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Error al eliminar: ' + error.message);
                return;
            }

            alert('Producto eliminado.');
            loadProducts();
        }

        // Limpiar formulario y restablecer a modo Agregar
        function resetForm() {
            document.getElementById('panel-title').innerText = 'Agregar Producto';
            document.getElementById('edit-prod-id').value = '';
            document.getElementById('edit-prod-image-url').value = '';
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-file').value = '';
            
            document.getElementById('save-btn').innerText = 'Subir Producto';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Funciones del Modal
        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
