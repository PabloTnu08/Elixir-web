<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIXIR</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 25px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .brand-name {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            margin-bottom: 6px;
            padding-bottom: 8px;
            display: inline-block;
            border-bottom: 2px solid var(--border);
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text);
            margin-top: 10px;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sub-tagline {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 8px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .product-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
            border-color: #404040;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .product-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent);
        }

        .btn-consult {
            background-color: transparent;
            color: var(--text);
            border: none;
            border-top: 1px solid var(--border);
            padding: 10px;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        /* ADMIN PANEL STYLES */
        #admin-panel {
            display: none;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        #admin-panel h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .btn-submit {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 10px 15px;
            font-weight: 700;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* MODAL / VISOR DE IMAGEN */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: var(--accent);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">ELIXIR</div>
        <div class="tagline">CATÁLOGO EXCLUSIVO</div>
        <div class="sub-tagline">Contamos con más variedad de mercancía, consultar al WhatsApp</div>
    </header>

    <!-- PANEL ADMIN (SE ACTIVA CON #admin en el navegador) -->
    <div id="admin-panel">
        <h3>Panel de Administración</h3>
        <div class="form-group">
            <label>Nombre del Producto</label>
            <input type="text" id="prodName" placeholder="Ej: Camisa Oversize">
        </div>
        <div class="form-group">
            <label>Precio ($)</label>
            <input type="number" id="prodPrice" placeholder="Ej: 25">
        </div>
        <div class="form-group">
            <label>Imagen del Producto</label>
            <input type="file" id="prodImage" accept="image/*">
        </div>
        <button class="btn-submit" onclick="uploadProduct()">Subir Producto</button>
    </div>

    <main class="gallery-grid" id="gallery">
        <p style="color: var(--muted); text-align: center; grid-column: 1/-1;">Cargando productos...</p>
    </main>

    <!-- VENTANA PARA VER LA IMAGEN EN GRANDE -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <footer>
        <p>&copy; ELIXIR - Todos los derechos reservados</p>
    </footer>

    <script>
        // --- CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = "https://ojrxjgfjnsbnjplqnall.supabase.co"; //
        const SUPABASE_ANON_KEY = "Sb_publishable_432fYrFKU4G3HMa6Y9XKtg_1YjuMXWL";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const WA_LINK = "https://wa.link/50jjzl";

        // Cargar productos al abrir la página
        async function fetchProducts() {
            const container = document.getElementById("gallery");
            const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });

            if (error) {
                console.error('Error al cargar:', error);
                container.innerHTML = `<p style="color: var(--muted); text-align: center; grid-column: 1/-1;">Error al cargar la tienda.</p>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<p style="color: var(--muted); text-align: center; grid-column: 1/-1;">No hay productos aún. Entra como admin para agregar.</p>`;
                return;
            }

            container.innerHTML = data.map(product => `
                <div class="product-card">
                    <div class="image-container" onclick="openModal('${product.image_url}')">
                        <img src="${product.image_url}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${product.name}</div>
                        <div class="product-price">$${product.price}</div>
                    </div>
                    <a href="${WA_LINK}" target="_blank" class="btn-consult">Consultar</a>
                </div>
            `).join('');
        }

        // Subir nuevo producto desde el panel
        async function uploadProduct() {
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const fileInput = document.getElementById('prodImage');
            const file = fileInput.files[0];

            if (!name || !price || !file) {
                alert("Por favor completa todos los campos y selecciona una imagen.");
                return;
            }

            alert("Subiendo producto, por favor espera...");

            // 1. Subir imagen a Supabase Storage
            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('product-images')
                .upload(fileName, file);

            if (uploadError) {
                alert("Error al subir la imagen: " + uploadError.message);
                return;
            }

            // 2. Obtener URL pública de la imagen
            const { data: publicURLData } = supabaseClient.storage
                .from('product-images')
                .getPublicUrl(fileName);

            const image_url = publicURLData.publicUrl;

            // 3. Guardar registro en la tabla products
            const { error: insertError } = await supabaseClient
                .from('products')
                .insert([{ name, price: parseFloat(price), image_url }]);

            if (insertError) {
                alert("Error al guardar el producto: " + insertError.message);
                return;
            }

            alert("¡Producto publicado con éxito!");
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            fileInput.value = '';
            fetchProducts();
        }

        // Sistema de Admin por URL (#admin con contraseña)
        window.addEventListener('hashchange', checkAdmin);
        function checkAdmin() {
            if (window.location.hash === '#admin') {
                const pass = prompt("Contraseña de Administrador:");
                if (pass === "33345891") {
                    document.getElementById('admin-panel').style.display = 'block';
                } else {
                    alert("Contraseña incorrecta");
                    window.location.hash = '';
                }
            } else {
                document.getElementById('admin-panel').style.display = 'none';
            }
        }

        function openModal(imgSrc) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("expandedImg");
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        // Inicializar
        checkAdmin();
        fetchProducts();
    </script>
</body>
</html>
