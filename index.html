
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIXIR</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --border: #262626;
            --text: #f5f5f5;
            --muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 60px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0 25px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .brand-name {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 10px;
            text-transform: uppercase;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            margin-bottom: 6px;
            padding-bottom: 8px;
            display: inline-block;
            border-bottom: 2px solid var(--border);
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text);
            margin-top: 10px;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sub-tagline {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 8px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .product-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
            border-color: #404040;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-text {
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
            padding: 10px;
        }

        .btn-consult {
            background-color: transparent;
            color: var(--text);
            border: none;
            border-top: 1px solid var(--border);
            padding: 12px;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        /* MODAL / VISOR DE IMAGEN */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: var(--accent);
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-name">ELIXIR</div>
        <div class="tagline">CATÁLOGO EXCLUSIVO</div>
        <div class="sub-tagline">Contamos con más variedad de mercancía, consultar al WhatsApp</div>
    </header>

    <main class="gallery-grid" id="gallery"></main>

    <!-- VENTANA PARA VER LA IMAGEN EN GRANDE -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="expandedImg">
    </div>

    <footer>
        <p>&copy; ELIXIR - Todos los derechos reservados</p>
    </footer>

    <script>
        // ENLACE DIRECTO A TU WHATSAPP
        const WA_LINK = "https://wa.link/50jjzl";

        // EXACTAMENTE 8 ESPACIOS PARA IMÁGENES
        const productImages = [
            "imagen1.jpg",
            "imagen2.jpg",
            "imagen3.jpg",
            "imagen4.jpg",
            "imagen5.jpg",
            "imagen6.jpg",
            "imagen7.jpg",
            "imagen8.jpg"
        ];

        function renderGallery() {
            const container = document.getElementById("gallery");
            container.innerHTML = productImages.map((imgSrc, index) => `
                <div class="product-card">
                    <div class="image-container" onclick="openModal('${imgSrc}')">
                        <img src="${imgSrc}" alt="Producto ELIXIR" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'placeholder-text\'>Imagen ${index + 1}<br>(Agregar foto)</div>';">
                    </div>
                    <a href="${WA_LINK}" target="_blank" class="btn-consult">Consultar</a>
                </div>
            `).join('');
        }

        function openModal(imgSrc) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("expandedImg");
            modal.style.display = "flex";
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById("imageModal").style.display = "none";
        }

        renderGallery();
    </script>
</body>
</html>
